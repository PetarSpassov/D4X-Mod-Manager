<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D4X Mod Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>D4X Mod Manager</h1>
  <span id="game"></span>
  <span id="install-state" class="pill"></span>
</header>
<div class="toolbar">
  <button id="import">Import…</button>
  <span class="drop-hint">or drop archives anywhere</span>
  <input id="search" type="search" placeholder="Search mods">
</div>
<main>
  <ul id="mods"><li class="empty">Loading…</li></ul>
  <p class="hint">Drag ⠿ to reorder. Lower in the list loads later and wins.</p>
  <details id="last" hidden><summary></summary><ul></ul></details>
</main>
<footer>
  <div id="status"></div>
  <div class="actions">
    <span class="spacer"></span>
    <button id="restore">Remove all mods</button>
    <button id="install" class="primary">Install</button>
  </div>
</footer>
<script src="page.js"></script>
</body>
</html>
