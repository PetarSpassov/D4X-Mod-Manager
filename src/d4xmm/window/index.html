<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D4X Mod Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="tabs">
  <button class="tab active" data-tab="installed">Installed</button>
  <button class="tab" data-tab="browse">Browse</button>
  <button class="tab" data-tab="settings">Settings</button>
  <span class="spacer"></span>
  <span id="install-state" class="pill"></span>
</nav>
<section id="tab-installed" class="page">
  <div class="toolbar">
    <span class="profile">
      <span class="picker" id="profile-picker">
        <button id="profile" title="Profile: its own load order and ticks"></button>
        <ul id="profile-list" hidden></ul>
      </span>
      <span id="profile-form" hidden>
        <input id="profile-name" placeholder="New profile name" spellcheck="false">
        <button id="profile-create">Create</button>
        <button id="profile-cancel">Cancel</button>
      </span>
      <button class="icon" id="profile-new" title="New profile from this one">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
      <button class="icon" id="profile-delete" title="Delete this profile">
        <svg viewBox="0 0 16 16"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4"/></svg></button>
    </span>
    <span class="spacer"></span>
    <button id="import" title="Or drop archives anywhere on the window">Import…</button>
    <input id="search" type="search" placeholder="Search mods">
  </div>
  <main id="list">
    <ul id="mods"><li class="empty">Loading…</li></ul>
  </main>
  <footer>
    <details id="last" hidden><summary></summary><ul></ul></details>
    <div id="status" hidden><span id="status-text"></span>
      <button id="status-close" title="Dismiss">×</button></div>
    <span class="spacer"></span>
    <button id="restore">Remove all mods</button>
    <button id="install" class="primary">Install</button>
  </footer>
</section>
<section id="tab-browse" class="page" hidden>
  <div class="toolbar">
    <span id="browse-count"></span>
    <span class="spacer"></span>
    <button id="browse-reload" title="Ask Nexus again">Reload</button>
    <input id="browse-search" type="search" placeholder="Search Nexus mods">
  </div>
  <main><ul id="catalog"><li class="empty">Loading…</li></ul></main>
</section>
<section id="tab-settings" class="page" hidden>
  <main class="settings">
    <label for="set-game_dir">Game folder</label>
    <div class="field">
      <input id="set-game_dir" data-key="game_dir" spellcheck="false">
      <button data-choose="game_dir">Choose…</button>
    </div>
    <p id="game-error" class="error" hidden>D4X.exe is not in this folder.
      Choose the Dune: Spice Wars folder in your Steam library.</p>
    <label for="set-downloads">Downloads folder</label>
    <div class="field">
      <input id="set-downloads" data-key="downloads" spellcheck="false">
      <button data-choose="downloads">Choose…</button>
    </div>
    <label for="set-nexus_key">Nexus API key</label>
    <div class="field">
      <input id="set-nexus_key" data-key="nexus_key" type="password" spellcheck="false"
             autocomplete="off" placeholder="From your Nexus Mods account settings">
    </div>
  </main>
</section>
<script src="page.js"></script>
<script src="profiles.js"></script>
<script src="browse.js"></script>
</body>
</html>
